name: Fork PR 12315 Linux diagnostics
'on':
  push:
    branches:
    - ci/pr-12315-full-validation
permissions:
  contents: read
concurrency:
  group: fork-pr-12315-linux-diagnostics-${{ github.ref }}
  cancel-in-progress: false
jobs:
  linux:
    name: Fork Linux candidate and baseline diagnostics
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    defaults:
      run:
        shell: bash
    env:
      SOURCE_SHA: 9b5e1b178bedf9fa32b5e0ebda410063a09b0b34
      CMAKE_BUILD_PARALLEL_LEVEL: 4
      CTEST_PARALLEL_LEVEL: 1
      ANYPS5_REQUIRE_VULKAN: 1
      GALLIUM_OVERRIDE_CPU_CAPS: avx
      BASE_SHA: 3a2b91981651569163768854a1fcdc7193b6667b
    steps:
    - name: Initialize validation logs
      run: |
        set -euo pipefail
        umask 022
        export EVIDENCE_ROOT="$RUNNER_TEMP/pr-12315-linux-diagnostics"
        printf 'EVIDENCE_ROOT=%s\n' "$EVIDENCE_ROOT" >> "$GITHUB_ENV"
        mkdir -p "$EVIDENCE_ROOT/candidate" "$EVIDENCE_ROOT/baseline"
        {
          printf 'Candidate source: %s\nWorkflow commit: %s\n' "$SOURCE_SHA" "$GITHUB_SHA"
          printf 'This is an independent fork validation, not an upstream required check or console validation.\n'
          uname -a
          nproc
          free -h
          df -h "$GITHUB_WORKSPACE"
        } 2>&1 | tee "$EVIDENCE_ROOT/candidate/environment.log"
    - name: Prepare the public diagnostic reporter
      run: "set -euo pipefail\numask 022\ncat > \"$RUNNER_TEMP/cireport.py\" <<'PY_REPORT'\nimport argparse\nimport math\nfrom pathlib import Path\nimport re\nimport\
        \ sys\nimport xml.etree.ElementTree as ET\n\nMAX_ANNOTATIONS = 10\nMAX_MESSAGE_BYTES = 15000\nANSI = re.compile(r\"\\x1b\\[[0-?]*[ -/]*[@-~]\")\nSENSITIVE\
        \ = re.compile(\n    r\"(?i)authorization|cookie|bearer|password|passwd|private[ _-]?key|\"\n    r\"-----BEGIN|\\b[A-Z_]*(?:TOKEN|SECRET|CREDENTIAL|API_KEY)[A-Z_]*\\\
        b|\"\n    r\"[a-z][a-z0-9+.-]*://[^\\s/]*@|\"\n    r\"\\b(?:gh[pousr]_|github_pat_|AKIA|ASIA)[A-Za-z0-9_]+\"\n)\nDIAGNOSTIC = re.compile(\n    r\"(?i)\\berror\\\
        b|\\bassert(?:ion)?\\b|\\bfailed\\b|\\bfailure\\b|\"\n    r\"\\bexception\\b|\\btimeout\\b|\\btimed out\\b|\\bdeadline\\b|\"\n    r\"\\bterminate\\b|\\babort(?:ed)?\\\
        b|\\bwhat\\(\\):|\"\n    r\"^AGC graphics:|^FAILED:|^\\[gpu\\] recorded batch\"\n)\nASSIGNMENT = re.compile(r\"^[A-Z_][A-Z0-9_]*\\s*=\")\nCTEST_SKIP = re.compile(r\"\
        SKIP_RETURN_CODE=\\d+|SKIP_REGULAR_EXPRESSION_MATCHED\", re.I)\nSECRET_VALUE = re.compile(r\"[a-z][a-z0-9+.-]*://[^\\s/]*@|\\b(?:gh[pousr]_|github_pat_|AKIA|ASIA)[A-Za-z0-9_]+\"\
        , re.I)\n\n\ndef safe(value, limit=400, redact=True):\n    value = ANSI.sub(\"\", str(value))\n    value = \"\".join(c for c in value if c in \"\\n\\r\\t\"\
        \ or ord(c) >= 32)\n    value = value.replace(\"\\x7f\", \"\")\n    if SECRET_VALUE.search(value) or (redact and SENSITIVE.search(value)):\n        return\
        \ \"[potentially sensitive content omitted]\"\n    return value if len(value) <= limit else value[:limit] + \" ... [truncated]\"\n\n\ndef single(value, limit):\n\
        \    return safe(value, limit, redact=False).replace(\"\\n\", \" \").replace(\"\\r\", \" \")\n\n\ndef escape(value, attribute=False):\n    value = value.replace(\"\
        %\", \"%25\").replace(\"\\r\", \"%0D\").replace(\"\\n\", \"%0A\")\n    if attribute:\n        value = value.replace(\":\", \"%3A\").replace(\",\", \"%2C\"\
        )\n    return value\n\n\ndef emit(level, title, message, total):\n    encoded = escape(message).encode(\"utf-8\")\n    if len(encoded) > MAX_MESSAGE_BYTES:\n\
        \        suffix = escape(\n            f\"\\n[annotation truncated; {total} cases in this category in total; \"\n            \"see the complete JUnit artifact\
        \ and job summary for all cases]\"\n        ).encode(\"utf-8\")\n        encoded = encoded[:MAX_MESSAGE_BYTES - len(suffix)].decode(\"utf-8\", \"ignore\"\
        ).encode(\"utf-8\") + suffix\n    print(\"::\" + level + \" title=\" + escape(safe(title, 160), True) + \"::\" + encoded.decode(\"utf-8\"))\n\n\ndef read_report(path):\n\
        \    root = ET.parse(path).getroot()\n    if root.tag not in (\"testsuite\", \"testsuites\"):\n        raise ValueError(\"Unexpected JUnit root\")\n    records\
        \ = []\n    for case in root.iter(\"testcase\"):\n        problems = [node for kind in (\"failure\", \"error\") for node in case.findall(kind)]\n        skip\
        \ = case.find(\"skipped\")\n        recognized_skip = skip is not None and CTEST_SKIP.fullmatch(skip.get(\"message\", \"\").strip())\n        not_run = case.get(\"\
        status\") == \"disabled\" or (case.get(\"status\") == \"notrun\" and not recognized_skip)\n        if problems:\n            state = \"failed\"\n        elif\
        \ not_run:\n            state = \"not_run\"\n        elif skip is not None:\n            state = \"skipped\"\n        elif case.get(\"status\") in (\"fail\"\
        , \"error\"):\n            state = \"failed\"\n        else:\n            state = \"passed\"\n        name = case.get(\"name\", \"<unnamed>\")\n        reason\
        \ = \"; \".join(safe(node.get(\"message\", \"failure\"), 180) for node in problems) or state\n        diagnostic = []\n        output = \"\\n\".join(case.findtext(channel)\
        \ or \"\" for channel in (\"system-out\", \"system-err\"))\n        for line in output[-32000:].splitlines():\n            line = ANSI.sub(\"\", line).strip()\n\
        \            if DIAGNOSTIC.search(line) and not SENSITIVE.search(line) and not ASSIGNMENT.search(line):\n                diagnostic.append(safe(line, 400))\n\
        \        records.append(dict(name=name, state=state, reason=reason, diagnostic=diagnostic[-3:]))\n    return records\n\n\ndef notice_counts(title, records):\n\
        \    counts = {key: sum(item[\"state\"] == key for item in records) for key in (\"passed\", \"failed\", \"skipped\", \"not_run\")}\n    message = f\"total={len(records)};\
        \ \" + \"; \".join(f\"{key}={value}\" for key, value in counts.items())\n    emit(\"notice\", title, message + \". Skips remain unverified and require the\
        \ separate repository skip audit.\", len(records))\n\n\ndef unique_index(records):\n    index = {}\n    for item in records:\n        name = item[\"name\"\
        ]\n        index[name] = item if name not in index else None\n    return index\n\n\ndef publish_errors(title, entries):\n    if not entries:\n        return\n\
        \    width = math.ceil(len(entries) / MAX_ANNOTATIONS)\n    for offset in range(0, len(entries), width):\n        group = entries[offset:offset + width]\n\
        \        lines = [f\"{len(entries)} failure/comparison records total; records {offset + 1}-{offset + len(group)}:\"]\n        lines.extend(item[0] for item\
        \ in group)\n        for name, diagnostic in group:\n            if diagnostic:\n                lines.extend([\"Diagnostics for \" + name, *diagnostic])\n\
        \        emit(\"error\", title, \"\\n\".join(lines), len(entries))\n\n\ndef main():\n    parser = argparse.ArgumentParser()\n    parser.add_argument(\"--report\"\
        , type=Path, required=True)\n    parser.add_argument(\"--platform\", required=True)\n    parser.add_argument(\"--source\", required=True)\n    parser.add_argument(\"\
        --baseline\", type=Path)\n    parser.add_argument(\"--baseline-source\")\n    parser.add_argument(\"--require-passed\", action=\"append\", default=[])\n \
        \   args = parser.parse_args()\n    if bool(args.baseline) != bool(args.baseline_source):\n        parser.error(\"--baseline and --baseline-source must be\
        \ supplied together\")\n    title = f\"CTest {single(args.platform, 40)} source {single(args.source, 100)}\"\n    try:\n        records = read_report(args.report)\n\
        \    except (OSError, ET.ParseError, ValueError):\n        emit(\"notice\", title, \"total=unavailable; report missing or malformed\", 0)\n        for name\
        \ in dict.fromkeys(args.require_passed):\n            emit(\"notice\", title, \"Required test \" + single(name, 320) + \": missing (report unavailable)\"\
        , 1)\n        emit(\"error\", title, \"Missing or malformed JUnit report; full validation is incomplete.\", 0)\n        return 1\n    notice_counts(title,\
        \ records)\n    if not records:\n        for name in dict.fromkeys(args.require_passed):\n            emit(\"notice\", title, \"Required test \" + single(name,\
        \ 320) + \": missing\", 1)\n        emit(\"error\", title, \"JUnit contains no test cases; full validation is incomplete.\", 0)\n        return 1\n    candidate\
        \ = unique_index(records)\n    failures = [item for item in records if item[\"state\"] in (\"failed\", \"not_run\")]\n    required_entries = []\n    required_failed\
        \ = False\n    for name in dict.fromkeys(args.require_passed):\n        item = candidate.get(name)\n        state = item[\"state\"] if item is not None else\
        \ \"missing or ambiguous\"\n        emit(\"notice\", title, \"Required test \" + single(name, 320) + \": \" + state, 1)\n        if state != \"passed\":\n\
        \            required_failed = True\n            if item not in failures:\n                required_entries.append((\"Required test \" + single(name, 320)\
        \ + \" \u2014 \" + state, []))\n    entries = []\n    if args.baseline is None:\n        entries = [(single(item[\"name\"], 320) + \" \u2014 \" + item[\"\
        reason\"], item[\"diagnostic\"]) for item in failures]\n        entries.extend(required_entries)\n        publish_errors(title, entries)\n        return int(bool(failures)\
        \ or required_failed)\n    baseline_title = f\"CTest {single(args.platform, 40)} baseline {single(args.baseline_source, 100)}\"\n    baseline_valid = True\n\
        \    try:\n        baseline_records = read_report(args.baseline)\n    except (OSError, ET.ParseError, ValueError):\n        baseline_records = []\n      \
        \  baseline_valid = False\n        emit(\"notice\", baseline_title, \"total=unavailable; report missing or malformed\", 0)\n    else:\n        notice_counts(baseline_title,\
        \ baseline_records)\n        baseline_valid = bool(baseline_records)\n    baseline = unique_index(baseline_records)\n    categories = dict(both_failed=0,\
        \ candidate_only_failed=0, incomparable=0)\n    for item in failures:\n        previous = baseline.get(item[\"name\"])\n        if item[\"state\"] == \"not_run\"\
        \ or previous is None or previous[\"state\"] in (\"skipped\", \"not_run\"):\n            category = \"incomparable\"\n        elif previous[\"state\"] ==\
        \ \"failed\":\n            category = \"both_failed\"\n        else:\n            category = \"candidate_only_failed\"\n        categories[category] += 1\n\
        \        previous_state = previous[\"state\"] if previous is not None else \"missing or ambiguous\"\n        label = f\"[{category}] \" + single(item[\"name\"\
        ], 320) + f\" \u2014 candidate={item['state']}; baseline={previous_state}; \" + item[\"reason\"]\n        diagnostic = [\"candidate: \" + line for line in\
        \ item[\"diagnostic\"]]\n        if previous is not None and previous[\"state\"] == \"failed\":\n            diagnostic.extend(\"baseline: \" + line for line\
        \ in previous[\"diagnostic\"])\n        entries.append((label, diagnostic))\n    if not baseline_valid:\n        entries.append((\"Baseline report missing,\
        \ malformed, or empty; attribution is incomplete\", []))\n    entries.extend(required_entries)\n    comparison = \"; \".join(f\"{key}={value}\" for key, value\
        \ in categories.items())\n    emit(\"notice\", title, comparison + \". both_failed means the same named test failed in both runs; it does not prove identical\
        \ causes. Comparison-only exit status never replaces the original candidate CTest/skip gates.\", len(failures))\n    publish_errors(title, entries)\n    return\
        \ int(not baseline_valid or required_failed or categories[\"candidate_only_failed\"] > 0 or categories[\"incomparable\"] > 0)\n\n\nif __name__ == \"__main__\"\
        :\n    sys.exit(main())\nPY_REPORT\n\ncat > \"$RUNNER_TEMP/check-ctest-report.py\" <<'PY_COMPLETENESS'\nimport argparse\nfrom collections import Counter\n\
        import json\nfrom pathlib import Path\nimport sys\nimport xml.etree.ElementTree as ET\n\nparser = argparse.ArgumentParser()\nparser.add_argument('--manifest',\
        \ type=Path, required=True)\nparser.add_argument('--report', type=Path, required=True)\nparser.add_argument('--output', type=Path, required=True)\nargs =\
        \ parser.parse_args()\nresult = {'report_complete': False}\ntry:\n    manifest = json.loads(args.manifest.read_text())\n    tests = manifest.get('tests')\n\
        \    if not isinstance(tests, list) or not tests:\n        raise ValueError('CTest manifest contains no test list')\n    expected = [test['name'] for test\
        \ in tests]\n    if any(not isinstance(name, str) or not name for name in expected):\n        raise ValueError('CTest manifest contains an invalid test name')\n\
        \    root = ET.parse(args.report).getroot()\n    if root.tag not in ('testsuite', 'testsuites'):\n        raise ValueError('Unexpected JUnit root')\n    actual\
        \ = [case.get('name') for case in root.iter('testcase')]\n    if any(not isinstance(name, str) or not name for name in actual):\n        raise ValueError('JUnit\
        \ contains an invalid test name')\n    expected_counts = Counter(expected)\n    actual_counts = Counter(actual)\n    result.update({\n        'manifest_count':\
        \ len(expected),\n        'junit_count': len(actual),\n        'missing_names': list((expected_counts - actual_counts).elements()),\n        'unexpected_names':\
        \ list((actual_counts - expected_counts).elements()),\n        'report_complete': bool(actual) and expected_counts == actual_counts,\n    })\nexcept (OSError,\
        \ ValueError, TypeError, KeyError, AttributeError, ET.ParseError) as error:\n    result['error'] = str(error)\ntext = json.dumps(result, indent=2) + '\\n'\n\
        args.output.write_text(text)\nprint(text, end='')\nsys.exit(0 if result['report_complete'] else 1)\nPY_COMPLETENESS\n"
    - name: Check out the fixed candidate and submodules
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: 9b5e1b178bedf9fa32b5e0ebda410063a09b0b34
        fetch-depth: 2
        submodules: recursive
        persist-credentials: false
    - name: Verify source identity
      run: |
        set -euo pipefail
        umask 022
        {
          actual=$(git rev-parse HEAD)
          printf 'Checked-out source: %s\n' "$actual"
          test "$actual" = "$SOURCE_SHA"
          test "$(git rev-parse "$SOURCE_SHA^")" = "$BASE_SHA"
          git submodule status --recursive
        } 2>&1 | tee "$EVIDENCE_ROOT/candidate/source.log"
    - name: Install build and runtime dependencies
      run: |
        set -euo pipefail
        umask 022
        sudo apt-get update 2>&1 | tee "$EVIDENCE_ROOT/candidate/dependencies.log"
        sudo apt-get install -y --no-install-recommends \
          build-essential binutils cmake ninja-build pkg-config python3 \
          libx11-dev libxext-dev libxrandr-dev \
          libwayland-dev libxkbcommon-dev libegl-dev libdecor-0-dev \
          libpipewire-0.3-dev libpulse-dev libasound2-dev \
          libvulkan1 mesa-vulkan-drivers vulkan-tools vulkan-validationlayers \
          2>&1 | tee -a "$EVIDENCE_ROOT/candidate/dependencies.log"
        {
          gcc --version
          g++ --version
          cmake --version
          ninja --version
          python3 --version
          dpkg-query -W mesa-vulkan-drivers linux-libc-dev
          df -h "$GITHUB_WORKSPACE"
        } 2>&1 | tee -a "$EVIDENCE_ROOT/candidate/environment.log"
    - name: Require working Linux asynchronous write watching
      run: |
        set -euo pipefail
        umask 022
        unset APS5_NO_WRITE_WATCH
        sudo sysctl -w vm.unprivileged_userfaultfd=1 \
          2>&1 | tee "$EVIDENCE_ROOT/candidate/write-watch.log"
        cat > "$RUNNER_TEMP/write-watch-probe.cpp" <<'CPP'
        #include "prx/libc/include/GuestWriteWatch.hpp"
        #include <cstdio>
        int main() {
          if (!GuestWriteWatch::GuestWriteWatchAvailable_nid_postfix()) {
            std::fputs("ERROR: The runner cannot execute the production Linux write-watch backend. Linux 6.7+, userfaultfd asynchronous/unpopulated write protection, and working PAGEMAP_SCAN are required. Validation cannot continue with that coverage missing.\n", stderr);
            return 1;
          }
          std::puts("Production Linux write-watch probe passed, including the backend's dirty-page scan and reset checks.");
          return 0;
        }
        CPP
        g++ -std=c++20 -O2 -pthread -Icore/libs \
          core/libs/prx/libc/src/GuestWriteWatch.cpp \
          "$RUNNER_TEMP/write-watch-probe.cpp" \
          -o "$RUNNER_TEMP/write-watch-probe" \
          2>&1 | tee -a "$EVIDENCE_ROOT/candidate/write-watch.log"
        "$RUNNER_TEMP/write-watch-probe" \
          2>&1 | tee -a "$EVIDENCE_ROOT/candidate/write-watch.log"
    - name: Require lavapipe and record Vulkan capabilities
      run: |
        set -euo pipefail
        umask 022
        icds=(/usr/share/vulkan/icd.d/lvp_icd*.json)
        if [ "${#icds[@]}" -ne 1 ] || [ ! -f "${icds[0]}" ]; then
          printf 'ERROR: Expected exactly one lavapipe ICD manifest.\n' \
            | tee "$EVIDENCE_ROOT/candidate/vulkan.log"
          exit 1
        fi
        export VK_DRIVER_FILES="${icds[0]}"
        printf 'VK_DRIVER_FILES=%s\n' "$VK_DRIVER_FILES" >> "$GITHUB_ENV"
        export XDG_RUNTIME_DIR="$RUNNER_TEMP/xdg-runtime"
        mkdir -p "$XDG_RUNTIME_DIR"
        chmod 700 "$XDG_RUNTIME_DIR"
        printf 'XDG_RUNTIME_DIR=%s\n' "$XDG_RUNTIME_DIR" >> "$GITHUB_ENV"
        vulkaninfo --summary 2>&1 | tee "$EVIDENCE_ROOT/candidate/vulkan.log"
    - name: Configure the complete candidate and verify test registration
      id: candidate_configure
      run: |
        set -euo pipefail
        umask 022
        cmake -S . -B build -G Ninja \
          -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON \
          -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++ \
          -DANYPS5_ENABLE_SPIRV_TOOLS=ON \
          2>&1 | tee "$EVIDENCE_ROOT/candidate/configure.log"
        python3 tools/check_test_registration.py build \
          2>&1 | tee "$EVIDENCE_ROOT/candidate/test-registration.log"
    - name: Build all candidate default targets
      id: candidate_build
      run: |
        set -euo pipefail
        umask 022
        cmake --build build 2>&1 | tee "$EVIDENCE_ROOT/candidate/build.log"
    - name: Build all candidate patched libraries
      id: candidate_libs
      run: |
        set -euo pipefail
        umask 022
        cmake --build build --target libs 2>&1 | tee "$EVIDENCE_ROOT/candidate/libs.log"
    - name: Run every candidate CTest serially and preserve its exit code
      id: candidate_tests
      run: |
        set -euo pipefail
        umask 022
        printf 'report_complete=false\n' >> "$GITHUB_OUTPUT"
        ctest --test-dir build --show-only=json-v1 > "$EVIDENCE_ROOT/candidate/test-manifest.json"
        set +e
        ctest --test-dir build -V --output-on-failure --timeout 120 --parallel 1 \
          --no-tests=error \
          --output-log "$EVIDENCE_ROOT/candidate/ctest.log" \
          --output-junit "$EVIDENCE_ROOT/candidate/ctest.xml" \
          2>&1 | tee "$EVIDENCE_ROOT/candidate/ctest-console.log"
        pipeline_status=("${PIPESTATUS[@]}")
        set -e
        ctest_status=${pipeline_status[0]}
        tee_status=${pipeline_status[1]}
        printf '%s\n' "$ctest_status" > "$EVIDENCE_ROOT/candidate/ctest-exit-code.txt"
        printf '%s\n' "$tee_status" > "$EVIDENCE_ROOT/candidate/tee-exit-code.txt"
        printf 'ctest_exit_code=%s\n' "$ctest_status" >> "$GITHUB_OUTPUT"
        if [ -f "$EVIDENCE_ROOT/candidate/ctest.xml" ]; then
          printf 'report_exists=true\n' >> "$GITHUB_OUTPUT"
        else
          printf 'report_exists=false\n' >> "$GITHUB_OUTPUT"
        fi
        set +e
        python3 "$RUNNER_TEMP/check-ctest-report.py" \
          --manifest "$EVIDENCE_ROOT/candidate/test-manifest.json" \
          --report "$EVIDENCE_ROOT/candidate/ctest.xml" \
          --output "$EVIDENCE_ROOT/candidate/report-integrity.json" \
          2>&1 | tee "$EVIDENCE_ROOT/candidate/report-integrity.log"
        integrity_status=("${PIPESTATUS[@]}")
        set -e
        report_complete=false
        if [ "${integrity_status[0]}" -eq 0 ] && [ "${integrity_status[1]}" -eq 0 ]; then
          report_complete=true
        fi
        printf 'report_complete=%s\n' "$report_complete" >> "$GITHUB_OUTPUT"
        printf '%s\n' "$report_complete" > "$EVIDENCE_ROOT/candidate/report-complete.txt"
        if [ "$ctest_status" -ne 0 ]; then
          exit "$ctest_status"
        fi
        if [ "$tee_status" -ne 0 ]; then
          exit "$tee_status"
        fi
        if [ "${integrity_status[0]}" -ne 0 ]; then
          exit "${integrity_status[0]}"
        fi
        exit "${integrity_status[1]}"
    - name: Preserve all candidate evidence and exit status
      id: candidate_snapshot
      if: always()
      env:
        EXPECTED_SOURCE: ${{ env.SOURCE_SHA }}
        CONFIGURE_OUTCOME: ${{ steps.candidate_configure.outcome }}
        BUILD_OUTCOME: ${{ steps.candidate_build.outcome }}
        LIBS_OUTCOME: ${{ steps.candidate_libs.outcome }}
        TESTS_OUTCOME: ${{ steps.candidate_tests.outcome }}
        REPORT_COMPLETE: ${{ steps.candidate_tests.outputs.report_complete }}
      run: |
        set -euo pipefail
        umask 022
        mkdir -p "$EVIDENCE_ROOT/candidate/build-metadata"
        if [ ! -f "$EVIDENCE_ROOT/candidate/ctest-exit-code.txt" ]; then
          printf 'not-run\n' > "$EVIDENCE_ROOT/candidate/ctest-exit-code.txt"
        fi
        for name in CMakeCache.txt CMakeFiles/CMakeConfigureLog.yaml Testing/Temporary/LastTest.log Testing/Temporary/LastTestsFailed.log; do
          if [ -f "build/$name" ]; then
            cp "build/$name" "$EVIDENCE_ROOT/candidate/build-metadata/$(basename "$name")"
          fi
        done
        python3 - <<'PY_METADATA'
        from datetime import datetime, timezone
        import json
        import os
        from pathlib import Path
        import subprocess

        directory = Path(os.environ['EVIDENCE_ROOT']) / 'candidate'
        head = subprocess.run(['git', 'rev-parse', 'HEAD'], capture_output=True, text=True)
        values = {
            'phase': 'candidate',
            'expected_source': os.environ['EXPECTED_SOURCE'],
            'checked_out_source': head.stdout.strip() if head.returncode == 0 else None,
            'workflow_commit': os.environ['GITHUB_SHA'],
            'recorded_utc': datetime.now(timezone.utc).isoformat(),
            'ctest_exit_code': (directory / 'ctest-exit-code.txt').read_text().strip(),
            'report_present': (directory / 'ctest.xml').is_file(),
            'report_complete': os.environ['REPORT_COMPLETE'] == 'true',
            'configure_outcome': os.environ['CONFIGURE_OUTCOME'],
            'build_outcome': os.environ['BUILD_OUTCOME'],
            'libs_outcome': os.environ['LIBS_OUTCOME'],
            'tests_outcome': os.environ['TESTS_OUTCOME'],
            'build_parallelism': os.environ['CMAKE_BUILD_PARALLEL_LEVEL'],
            'test_parallelism': os.environ['CTEST_PARALLEL_LEVEL'],
            'vulkan_driver_manifest': os.environ.get('VK_DRIVER_FILES'),
            'test_timeout_seconds': 120,
            'umask': '022',
        }
        (directory / 'metadata.json').write_text(json.dumps(values, indent=2) + '\n')
        print(json.dumps(values, indent=2))
        PY_METADATA
    - name: Independently audit candidate skipped and missing tests
      id: candidate_skips
      if: always()
      run: |
        set -euo pipefail
        umask 022
        python3 tools/check_skips.py "$EVIDENCE_ROOT/candidate/ctest.xml" --require-tests \
          2>&1 | tee "$EVIDENCE_ROOT/candidate/check-skips.log"
    - name: Publish bounded public candidate test-failure annotations
      if: always()
      run: |
        set -euo pipefail
        umask 022
        python3 "$RUNNER_TEMP/cireport.py" \
          --report "$EVIDENCE_ROOT/candidate/ctest.xml" \
          --platform linux --source "$SOURCE_SHA" --require-passed guest_crypto_memcmp --require-passed guest_libressl3_digest --require-passed guest_libressl3_asn1 --require-passed guest_libressl3_key_reference --require-passed guest_libressl3_object_parser --require-passed public_headers \
          2>&1 | tee "$EVIDENCE_ROOT/candidate/public-report.log"
    - name: Switch to the original base without losing candidate evidence
      id: baseline_prepare
      if: ${{ !cancelled() && steps.candidate_libs.outcome == 'success' && steps.candidate_tests.outputs.report_complete == 'true' && steps.candidate_tests.outcome
        == 'failure' && steps.candidate_tests.outputs.report_exists == 'true' && steps.candidate_tests.outputs.ctest_exit_code != '0' && steps.candidate_snapshot.outcome
        == 'success' }}
      run: |
        set -euo pipefail
        umask 022
        test -s "$EVIDENCE_ROOT/candidate/ctest.xml"
        test -s "$EVIDENCE_ROOT/candidate/metadata.json"
        test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
        git cat-file -e "$BASE_SHA^{commit}"
        test "$(git rev-parse "$SOURCE_SHA^")" = "$BASE_SHA"
        git diff --stat "$BASE_SHA" "$SOURCE_SHA" > "$EVIDENCE_ROOT/source-diff-stat.txt"
        git diff --name-only "$BASE_SHA" "$SOURCE_SHA" > "$EVIDENCE_ROOT/source-diff-files.txt"
        git ls-tree -r "$SOURCE_SHA" | awk '$1 == "160000" { print $3, $4 }' > "$EVIDENCE_ROOT/candidate/submodule-commits.txt"
        git ls-tree -r "$BASE_SHA" | awk '$1 == "160000" { print $3, $4 }' > "$EVIDENCE_ROOT/baseline/submodule-commits.txt"
        git checkout --detach "$BASE_SHA" \
          2>&1 | tee "$EVIDENCE_ROOT/baseline/checkout.log"
        test "$(git rev-parse HEAD)" = "$BASE_SHA"
        if cmp -s "$EVIDENCE_ROOT/candidate/submodule-commits.txt" "$EVIDENCE_ROOT/baseline/submodule-commits.txt" \
            && git diff --quiet "$SOURCE_SHA" "$BASE_SHA" -- .gitmodules; then
          printf 'Candidate and baseline submodule commits and .gitmodules match; reusing the existing submodule checkout.\n' \
            | tee "$EVIDENCE_ROOT/baseline/submodules.log"
        else
          git submodule sync --recursive \
            2>&1 | tee "$EVIDENCE_ROOT/baseline/submodules.log"
          git submodule update --init --recursive \
            2>&1 | tee -a "$EVIDENCE_ROOT/baseline/submodules.log"
        fi
        git submodule status --recursive \
          2>&1 | tee -a "$EVIDENCE_ROOT/baseline/submodules.log"
        printf 'Baseline source: %s\n' "$(git rev-parse HEAD)" \
          | tee "$EVIDENCE_ROOT/baseline/source.log"
    - name: Reconfigure the same build directory for the complete baseline
      id: baseline_configure
      if: ${{ !cancelled() && steps.baseline_prepare.outcome == 'success' }}
      run: |
        set -euo pipefail
        umask 022
        cmake -S . -B build -G Ninja \
          -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON \
          -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++ \
          -DANYPS5_ENABLE_SPIRV_TOOLS=ON \
          2>&1 | tee "$EVIDENCE_ROOT/baseline/configure.log"
        python3 tools/check_test_registration.py build \
          2>&1 | tee "$EVIDENCE_ROOT/baseline/test-registration.log"
    - name: Incrementally build all baseline default targets
      id: baseline_build
      if: ${{ !cancelled() && steps.baseline_configure.outcome == 'success' }}
      run: |
        set -euo pipefail
        umask 022
        cmake --build build 2>&1 | tee "$EVIDENCE_ROOT/baseline/build.log"
    - name: Build all baseline patched libraries
      id: baseline_libs
      if: ${{ !cancelled() && steps.baseline_build.outcome == 'success' }}
      run: |
        set -euo pipefail
        umask 022
        cmake --build build --target libs 2>&1 | tee "$EVIDENCE_ROOT/baseline/libs.log"
    - name: Run every baseline CTest serially and preserve its exit code
      id: baseline_tests
      if: ${{ !cancelled() && steps.baseline_libs.outcome == 'success' }}
      run: |
        set -euo pipefail
        umask 022
        printf 'report_complete=false\n' >> "$GITHUB_OUTPUT"
        ctest --test-dir build --show-only=json-v1 > "$EVIDENCE_ROOT/baseline/test-manifest.json"
        set +e
        ctest --test-dir build -V --output-on-failure --timeout 120 --parallel 1 \
          --no-tests=error \
          --output-log "$EVIDENCE_ROOT/baseline/ctest.log" \
          --output-junit "$EVIDENCE_ROOT/baseline/ctest.xml" \
          2>&1 | tee "$EVIDENCE_ROOT/baseline/ctest-console.log"
        pipeline_status=("${PIPESTATUS[@]}")
        set -e
        ctest_status=${pipeline_status[0]}
        tee_status=${pipeline_status[1]}
        printf '%s\n' "$ctest_status" > "$EVIDENCE_ROOT/baseline/ctest-exit-code.txt"
        printf '%s\n' "$tee_status" > "$EVIDENCE_ROOT/baseline/tee-exit-code.txt"
        printf 'ctest_exit_code=%s\n' "$ctest_status" >> "$GITHUB_OUTPUT"
        if [ -f "$EVIDENCE_ROOT/baseline/ctest.xml" ]; then
          printf 'report_exists=true\n' >> "$GITHUB_OUTPUT"
        else
          printf 'report_exists=false\n' >> "$GITHUB_OUTPUT"
        fi
        set +e
        python3 "$RUNNER_TEMP/check-ctest-report.py" \
          --manifest "$EVIDENCE_ROOT/baseline/test-manifest.json" \
          --report "$EVIDENCE_ROOT/baseline/ctest.xml" \
          --output "$EVIDENCE_ROOT/baseline/report-integrity.json" \
          2>&1 | tee "$EVIDENCE_ROOT/baseline/report-integrity.log"
        integrity_status=("${PIPESTATUS[@]}")
        set -e
        report_complete=false
        if [ "${integrity_status[0]}" -eq 0 ] && [ "${integrity_status[1]}" -eq 0 ]; then
          report_complete=true
        fi
        printf 'report_complete=%s\n' "$report_complete" >> "$GITHUB_OUTPUT"
        printf '%s\n' "$report_complete" > "$EVIDENCE_ROOT/baseline/report-complete.txt"
        if [ "$ctest_status" -ne 0 ]; then
          exit "$ctest_status"
        fi
        if [ "$tee_status" -ne 0 ]; then
          exit "$tee_status"
        fi
        if [ "${integrity_status[0]}" -ne 0 ]; then
          exit "${integrity_status[0]}"
        fi
        exit "${integrity_status[1]}"
    - name: Preserve all baseline evidence and exit status
      id: baseline_snapshot
      if: ${{ !cancelled() && steps.baseline_prepare.outcome != 'skipped' }}
      env:
        EXPECTED_SOURCE: ${{ env.BASE_SHA }}
        CONFIGURE_OUTCOME: ${{ steps.baseline_configure.outcome }}
        BUILD_OUTCOME: ${{ steps.baseline_build.outcome }}
        LIBS_OUTCOME: ${{ steps.baseline_libs.outcome }}
        TESTS_OUTCOME: ${{ steps.baseline_tests.outcome }}
        REPORT_COMPLETE: ${{ steps.baseline_tests.outputs.report_complete }}
      run: |
        set -euo pipefail
        umask 022
        mkdir -p "$EVIDENCE_ROOT/baseline/build-metadata"
        if [ ! -f "$EVIDENCE_ROOT/baseline/ctest-exit-code.txt" ]; then
          printf 'not-run\n' > "$EVIDENCE_ROOT/baseline/ctest-exit-code.txt"
        fi
        for name in CMakeCache.txt CMakeFiles/CMakeConfigureLog.yaml Testing/Temporary/LastTest.log Testing/Temporary/LastTestsFailed.log; do
          if [ -f "build/$name" ]; then
            cp "build/$name" "$EVIDENCE_ROOT/baseline/build-metadata/$(basename "$name")"
          fi
        done
        python3 - <<'PY_METADATA'
        from datetime import datetime, timezone
        import json
        import os
        from pathlib import Path
        import subprocess

        directory = Path(os.environ['EVIDENCE_ROOT']) / 'baseline'
        head = subprocess.run(['git', 'rev-parse', 'HEAD'], capture_output=True, text=True)
        values = {
            'phase': 'baseline',
            'expected_source': os.environ['EXPECTED_SOURCE'],
            'checked_out_source': head.stdout.strip() if head.returncode == 0 else None,
            'workflow_commit': os.environ['GITHUB_SHA'],
            'recorded_utc': datetime.now(timezone.utc).isoformat(),
            'ctest_exit_code': (directory / 'ctest-exit-code.txt').read_text().strip(),
            'report_present': (directory / 'ctest.xml').is_file(),
            'report_complete': os.environ['REPORT_COMPLETE'] == 'true',
            'configure_outcome': os.environ['CONFIGURE_OUTCOME'],
            'build_outcome': os.environ['BUILD_OUTCOME'],
            'libs_outcome': os.environ['LIBS_OUTCOME'],
            'tests_outcome': os.environ['TESTS_OUTCOME'],
            'build_parallelism': os.environ['CMAKE_BUILD_PARALLEL_LEVEL'],
            'test_parallelism': os.environ['CTEST_PARALLEL_LEVEL'],
            'vulkan_driver_manifest': os.environ.get('VK_DRIVER_FILES'),
            'test_timeout_seconds': 120,
            'umask': '022',
        }
        (directory / 'metadata.json').write_text(json.dumps(values, indent=2) + '\n')
        print(json.dumps(values, indent=2))
        PY_METADATA
    - name: Independently audit baseline skipped and missing tests
      id: baseline_skips
      if: ${{ !cancelled() && steps.baseline_prepare.outcome == 'success' }}
      run: |
        set -euo pipefail
        umask 022
        python3 tools/check_skips.py "$EVIDENCE_ROOT/baseline/ctest.xml" --require-tests \
          2>&1 | tee "$EVIDENCE_ROOT/baseline/check-skips.log"
    - name: Publish bounded public baseline test-failure annotations
      if: ${{ !cancelled() && steps.baseline_prepare.outcome != 'skipped' }}
      run: |
        set -euo pipefail
        umask 022
        python3 "$RUNNER_TEMP/cireport.py" \
          --report "$EVIDENCE_ROOT/baseline/ctest.xml" \
          --platform linux --source "$BASE_SHA" \
          2>&1 | tee "$EVIDENCE_ROOT/baseline/public-report.log"
    - name: Compare candidate failures with the same-runner baseline
      if: ${{ !cancelled() && steps.baseline_snapshot.outcome == 'success' && steps.baseline_tests.outputs.report_complete == 'true' }}
      run: |
        set -euo pipefail
        umask 022
        python3 "$RUNNER_TEMP/cireport.py" --report "$EVIDENCE_ROOT/candidate/ctest.xml" --baseline "$EVIDENCE_ROOT/baseline/ctest.xml" --baseline-source "$BASE_SHA" --platform linux --source "$SOURCE_SHA" --require-passed guest_crypto_memcmp --require-passed guest_libressl3_digest --require-passed guest_libressl3_asn1 --require-passed guest_libressl3_key_reference --require-passed guest_libressl3_object_parser --require-passed public_headers \
          2>&1 | tee "$EVIDENCE_ROOT/comparison.log"
    - name: Upload candidate and baseline evidence even after failure
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: fork-linux-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
        if-no-files-found: error
        retention-days: 14
        path: |
          ${{ env.EVIDENCE_ROOT }}
          ${{ runner.temp }}/write-watch-probe.cpp
          ${{ runner.temp }}/cireport.py
          ${{ runner.temp }}/check-ctest-report.py
